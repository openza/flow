name: Feature request
description: Suggest a feature or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      placeholder: What would you like Openza Flow to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
